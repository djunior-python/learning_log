{% extends "learning_logs/base.html" %}
{% load bootstrap4 %}

{% block page_header %}
    <h1>Add a new comment</h1>
{% endblock page_header %}

{% block content %}
    <h3><a href="{% url 'learning_logs:entry_detail' entry.id %}">Entry</a></h3>

    <form action="{% url 'learning_logs:add_comment' entry.id %}" 
        method='post'
        class="form">
        {% csrf_token %}
        {% bootstrap_form form %}
        {% buttons %}
            <button name="submit" class="btn btn-primary">Add comment</button>
        {% endbuttons %}
    </form>

{% endblock content %}
