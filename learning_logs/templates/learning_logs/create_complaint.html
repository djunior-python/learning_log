{% extends "learning_logs/base.html" %}
{% load bootstrap4 %}

{% block page_header %}
    <h2>Complaint about {{ data.title }}</h2>
{% endblock page_header %}

{% block content %}
    <form method="post" class="form">
        {% csrf_token %}
        {% bootstrap_form form %}
        <button type="submit" class="btn btn-danger">Send a complaint</button>
        <a href="{% url 'learning_logs:topic' data.id %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock content %}
