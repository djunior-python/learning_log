{% extends "learning_logs/base.html" %}
{% load bootstrap4 %}

{% block page_header %}
    <h1>Edit comment:</h1>
{% endblock page_header %}

{% block content %}

    <h3><a href="{% url 'learning_logs:entry_detail' comment.entry.id %}">Entry</a></h3>
    {% if comment.owner == user %}
        <form action="{% url 'learning_logs:edit_comment' comment.id %}"
            method="post"
            class="form">
            {% csrf_token %}
            {% bootstrap_form form %}

            {% buttons %}
                <button name="submit" class="btn btn-primary">Save changes</button>
            {% endbuttons %}
        </form>
    {% endif %}

{% endblock content %}
